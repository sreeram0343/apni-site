[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirects and headers are handled automatically by Netlify Next.js runtime plugin,
# but we configure node environment explicitly for serverless function compatibility.
[[plugins]]
  package = "@netlify/plugin-nextjs"
